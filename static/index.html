<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Nav</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%275%27 fill=%27%23ffd27a%27/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #04060d; color: #d8dce6;
    font: 13px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: absolute; background: rgba(10, 14, 26, .82); border: 1px solid #263048;
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #controls { top: 12px; left: 12px; width: 250px; max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
  #info { top: 12px; right: 12px; width: 270px; display: none; max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
  #iClose { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; margin: 0; line-height: 24px;
    font-size: 16px; border-radius: 50%; background: #1b2336; }
  #info h2 { padding-right: 28px; }
  .sub { font-size: 11px; color: #8fa3c8; margin: -4px 0 8px; }
  .sect { margin: 8px 0 3px; font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: #6f7c96; border-top: 1px solid #263048; padding-top: 6px; }
  #iLinks { margin-top: 8px; font-size: 12px; }
  #iLinks a { color: #7fd1ff; text-decoration: none; margin-right: 10px; }
  #iLinks a:hover { text-decoration: underline; }
  #legend { bottom: 12px; left: 12px; font-size: 12px; color: #98a2b8; }
  #help { bottom: 12px; right: 12px; font-size: 12px; color: #98a2b8; }
  h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .5px; }
  h2 { font-size: 14px; margin: 0 0 6px; }
  label { display: block; margin: 6px 0 2px; color: #98a2b8; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  select, input[type=text], input[type=datetime-local], button {
    width: 100%; box-sizing: border-box; background: #121a2c; color: #e6e9f0; border: 1px solid #2c3852;
    border-radius: 5px; padding: 5px 7px; font: inherit; }
  button { cursor: pointer; background: #1c2a4a; margin-top: 6px; }
  button:hover { background: #26375f; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; }
  .presets button, .angles button { font-size: 11px; padding: 4px 3px; }
  .checks { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .checks label { display: flex; align-items: center; gap: 5px; text-transform: none; letter-spacing: 0; font-size: 12px; color: #c6ccd8; margin: 2px 0; }
  .checks input { width: auto; }
  #status { margin-top: 8px; font-size: 11px; color: #8fa3c8; min-height: 2.6em; }
  #status.err { color: #ff8a80; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
  dt { color: #8a94a8; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #iNote { font-size: 12px; color: #b9c2d4; margin: 8px 0 0; }
  #menu { display: none; position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; padding: 0;
    font-size: 20px; line-height: 40px; text-align: center; z-index: 2; }
  @media (max-width: 700px), (max-height: 520px) {
    #menu { display: block; }
    #controls { display: none; top: 60px; width: min(250px, calc(100vw - 24px)); max-height: calc(100vh - 72px); }
    #controls.open { display: block; }
    #help { display: none; }
    #info { top: auto; bottom: 48px; right: 12px; left: 12px; width: auto; max-height: 55vh; }
    #legend { font-size: 10px; right: 12px; }
  }
  kbd { background: #1b2336; border: 1px solid #2f3a55; border-radius: 3px; padding: 0 4px; font: inherit; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<button id="menu" class="panel" title="Show controls">☰</button>
<div id="controls" class="panel">
  <h1>STAR NAV</h1>
  <label for="center">Locked on</label>
  <select id="center"></select>
  <label for="search">Find body</label>
  <input id="search" type="text" list="names" placeholder="e.g. Mars, Vega, Gaia BH1…">
  <datalist id="names"></datalist>
  <label>Zoom presets</label>
  <div class="row presets">
    <button data-au="3">Inner</button>
    <button data-au="45">Outer</button>
    <button data-au="1.6e6">25 ly</button>
    <button data-au="6.5e6">100 ly</button>
  </div>
  <div class="row presets">
    <button data-au="6.4e7">1,000 ly</button>
    <button data-au="7.6e9">Galaxy</button>
    <button data-au="4e11">Local Grp</button>
    <button data-au="1e13">Virgo</button>
  </div>
  <div class="row presets">
    <button data-au="6.3e13">1 Gly</button>
    <button data-au="1.6e14">2MRS edge</button>
    <button data-au="6.3e15">Universe</button>
  </div>
  <div class="row presets">
    <button data-lock="earth" data-au="7e-4">Earth orbit</button>
    <button data-lock="earth" data-au="6.5e-3">Earth–Moon</button>
  </div>
  <label>View angle</label>
  <div class="row angles">
    <button data-tilt="0">Top</button>
    <button data-tilt="55">Tilted</button>
    <button data-tilt="90">Edge-on</button>
    <button id="spin">Auto-spin</button>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="orbits" checked> Orbit rings</label>
    <label><input type="checkbox" id="rings" checked> Range rings</label>
    <label><input type="checkbox" id="starLabels"> All star names</label>
    <label><input type="checkbox" id="drops" checked> Height lines</label>
    <label><input type="checkbox" id="exag"> Height ×10</label>
    <label><input type="checkbox" id="galaxy" checked> Galaxy guides</label>
    <label><input type="checkbox" id="gaia" checked> Gaia stars</label>
    <label><input type="checkbox" id="density" checked> Galaxy density</label>
    <label><input type="checkbox" id="model" checked> Model disk</label>
    <label><input type="checkbox" id="cepheids" checked> Cepheids</label>
    <label><input type="checkbox" id="sats" checked> Satellites</label>
    <label><input type="checkbox" id="starlink" checked> Starlink</label>
  </div>
  <label for="epoch">Planet epoch (UTC)</label>
  <input id="epoch" type="datetime-local">
  <button id="refresh">Update planets from JPL Horizons</button>
  <button id="reloadStars">Reload star catalog (HYG)</button>
  <div id="status">Loading…</div>
</div>

<div id="info" class="panel">
  <button id="iClose" title="Close">×</button>
  <h2 id="iName"></h2>
  <div id="iSub" class="sub"></div>
  <p id="iNote"></p>
  <dl id="iBody"></dl>
  <div id="iLinks"></div>
  <button id="iCenter">Lock view here</button>
</div>

<div id="legend" class="panel"><span id="scaleText"></span></div>
<div id="help" class="panel">drag to tumble · wheel to zoom · click to select · double-click to lock on · <kbd>0</kbd> reset</div>

<script>
const AU_KM = 149597870.7, AU_PER_PC = 206264.806, AU_PER_LY = 63241.077;
const SOLAR = new Set(['sun', 'planet', 'moon', 'dwarf']);
const DEEP = new Set(['blackhole', 'galaxy', 'nebula', 'cluster', 'gcluster']);
const isLandmark = n => DEEP.has(n.kind) && n.note != null;   // curated objects vs catalog galaxies
const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let nodes = [], byId = {}, edges = [], meta = {};
let centerId = 'sun';
let scale = 60;                                    // px per AU
let selected = null, hover = null, screenPos = [];
let W = 0, H = 0, dpr = 1, spinning = false;
const MIN_SCALE = 1e-13, MAX_SCALE = 3e8;   // 3e8 px/AU: Earth ~12,800 px across, low orbits resolvable

// ------------------------------------------------------------- free trackball camera
// World: heliocentric ecliptic J2000, AU. R is a 3x3 rotation (row-major) applied to
// (point - locked body); screen x = row 0, screen y = row 1, depth (toward viewer) = row 2.
const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];
let R = I3.slice();
const mul = (A, B) => [0, 1, 2].flatMap(i => [0, 1, 2].map(j => A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]));
const rotX = a => [1, 0, 0, 0, Math.cos(a), Math.sin(a), 0, -Math.sin(a), Math.cos(a)];
const rotY = a => [Math.cos(a), 0, Math.sin(a), 0, 1, 0, -Math.sin(a), 0, Math.cos(a)];
const rotZ = a => [Math.cos(a), -Math.sin(a), 0, Math.sin(a), Math.cos(a), 0, 0, 0, 1];
function setAngle(tiltDeg, spinDeg = 35) { R = mul(rotX(tiltDeg * Math.PI / 180), rotZ(spinDeg * Math.PI / 180)); draw(); }
function tumble(dxPx, dyPx) {                      // rotate about the screen axes: any angle, no limits
  R = mul(rotX(-dyPx * 0.008), mul(rotY(dxPx * 0.008), R));
}

let C = { x: 0, y: 0, z: 0 }, zRef = 0, ZX = 1;
function updateCamera() {
  C = byId[centerId] || { x: 0, y: 0, z: 0 };
  ZX = $('exag').checked ? 10 : 1;
  zRef = SOLAR.has(C.kind) ? C.z : 0;             // exaggerate heights relative to the locked body's plane
}
const pos = n => [n.x, n.y, SOLAR.has(n.kind) ? zRef + (n.z - zRef) * ZX : n.z];
function proj3(x, y, z) {                          // world -> [sx, sy, depth]  (depth: larger = nearer)
  const dx = x - C.x, dy = y - C.y, dz = z - (SOLAR.has(C.kind) ? zRef + (C.z - zRef) * ZX : C.z);
  return [W / 2 + (R[0] * dx + R[1] * dy + R[2] * dz) * scale,
          H / 2 - (R[3] * dx + R[4] * dy + R[5] * dz) * scale,
          R[6] * dx + R[7] * dy + R[8] * dz];
}
const proj = n => proj3(...pos(n));

// galactic plane basis (in ecliptic coordinates) for the Milky Way schematic
function radecUnit(raDeg, decDeg) {
  const ra = raDeg * Math.PI / 180, dec = decDeg * Math.PI / 180, e = 23.4392911 * Math.PI / 180;
  const xq = Math.cos(dec) * Math.cos(ra), yq = Math.cos(dec) * Math.sin(ra), zq = Math.sin(dec);
  return [xq, yq * Math.cos(e) + zq * Math.sin(e), -yq * Math.sin(e) + zq * Math.cos(e)];
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const GAL_U = radecUnit(266.405, -28.936), GAL_N = radecUnit(192.859, 27.128), GAL_V = cross(GAL_N, GAL_U);
const ECL = [[1, 0, 0], [0, 1, 0]], GAL = [GAL_U, GAL_V];

// ------------------------------------------------------------- formatting
const trimNum = s => s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s;   // "1.50" -> "1.5", "120" stays "120"
function fmtDist(au) {
  const t = v => trimNum(v.toPrecision(3));
  if (au < 0.01) return (au * AU_KM).toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' km';
  if (au < 5000) return trimNum(au.toPrecision(4)) + ' AU';
  const ly = au / AU_PER_LY;
  if (ly < 1000) return t(ly) + ' ly';
  if (ly < 1e6) return t(ly / 1000) + 'k ly';
  if (ly < 1e9) return t(ly / 1e6) + ' Mly';
  return t(ly / 1e9) + ' Gly';
}
function niceStep(pxMin) {               // smallest 1/2/5 x 10^n AU whose length >= pxMin px
  let e = Math.floor(Math.log10(pxMin / scale)) - 1;
  for (let i = 0; i < 40; i++) {
    for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v * scale >= pxMin) return v; }
    e++;
  }
  return 1;
}
function ringPath(cx, cy, cz, r, basis = ECL) {   // circle of radius r in a plane through (cx,cy,cz)
  const [u, v] = basis;
  ctx.beginPath();
  for (let i = 0; i <= 96; i++) {
    const t = i / 96 * Math.PI * 2, a = Math.cos(t) * r, b = Math.sin(t) * r;
    const [sx, sy] = proj3(cx + u[0] * a + v[0] * b, cy + u[1] * a + v[1] * b, cz + u[2] * a + v[2] * b);
    i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
  }
}

// ------------------------------------------------------------- drawing
// ------------------------------------------------------------- textured globes
// Equirectangular maps (Solar System Scope, CC BY 4.0) wrapped per pixel onto each disc, lit by the
// Sun with the real phase, spun about the body's true pole. Earth's map is aligned to the current
// sidereal time so the continents facing the Sun are the ones actually in daylight right now.
const TEX = { sun: 'sun', mercury: 'mercury', venus: 'venus', earth: 'earth', moon: 'moon', mars: 'mars',
              jupiter: 'jupiter', saturn: 'saturn', uranus: 'uranus', neptune: 'neptune' };
// north pole RA, Dec (J2000, IAU) and sidereal rotation period in hours (negative = retrograde)
const POLES = { sun: [286.13, 63.87, 609.1], mercury: [281.01, 61.45, 1407.5], venus: [272.76, 67.16, -5832.5],
                earth: [0, 90, 23.934], moon: [266.86, 65.64, 655.7], mars: [317.68, 52.89, 24.62], jupiter: [268.06, 64.50, 9.925],
                saturn: [40.59, 83.54, 10.66], uranus: [257.31, -15.18, -17.24], neptune: [299.36, 43.46, 16.11] };
const texCache = {};
function ensureTexture(id, ext = 'jpg') {
  if (texCache[id] !== undefined) return texCache[id];
  texCache[id] = 'loading';
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
    texCache[id] = { w: img.width, h: img.height, d: g.getImageData(0, 0, img.width, img.height).data }; requestDraw();
  };
  img.onerror = () => { texCache[id] = null; };
  img.src = `tex/${id}.${ext}`;
  return 'loading';
}
function eqToEcl(x, y, z) { const e = 23.4392911 * Math.PI / 180, c = Math.cos(e), s = Math.sin(e); return [x, y * c + z * s, -y * s + z * c]; }
const norm3 = v => { const L = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / L, v[1] / L, v[2] / L]; };
function gmstRad() { const jd = Date.now() / 86400000 + 2440587.5; return ((280.46061837 + 360.98564736629 * (jd - 2451545.0)) % 360) * Math.PI / 180; }
function bodyFrame(n) {                            // [X (lon 0), Y (lon 90 E), N (north pole)] in ecliptic coords
  const P = POLES[n.id]; if (!P) return null;
  const N = n.id === 'earth' ? eqToEcl(0, 0, 1) : radecUnit(P[0], P[1]);
  let X;
  if (n.id === 'earth') { const g = gmstRad(); X = eqToEcl(Math.cos(g), Math.sin(g), 0); }
  else if (n.id === 'moon' && byId.earth) { const e = byId.earth, v = [e.x - n.x, e.y - n.y, e.z - n.z], k = v[0] * N[0] + v[1] * N[1] + v[2] * N[2]; X = norm3([v[0] - k * N[0], v[1] - k * N[1], v[2] - k * N[2]]); }
  else {
    let ref = cross(N, [0, 0, 1]); if (Math.hypot(...ref) < 1e-3) ref = cross(N, [1, 0, 0]); ref = norm3(ref);
    const ref2 = cross(N, ref), w = 2 * Math.PI * ((Date.now() / 3.6e6 / P[2]) % 1);
    X = [ref[0] * Math.cos(w) + ref2[0] * Math.sin(w), ref[1] * Math.cos(w) + ref2[1] * Math.sin(w), ref[2] * Math.cos(w) + ref2[2] * Math.sin(w)];
  }
  return [X, cross(N, X), N];
}
let globeBuf = null;
function drawTextured(n, sx, sy, r) {
  const tex = ensureTexture(TEX[n.id]); if (!tex || tex === 'loading') return false;
  const F = bodyFrame(n); if (!F) return false;
  const isSaturn = n.id === 'saturn', ring = isSaturn ? ensureTexture('saturn_ring', 'png') : null;
  const hasRing = ring && ring !== 'loading';
  const ext = hasRing ? 2.35 : 1.0;                 // render extent in body radii
  const rr = Math.min(r, hasRing ? 190 : 340), size = Math.ceil(rr * ext * 2) + 2, half = size / 2;
  if (!globeBuf || globeBuf.size !== size) { const cv = document.createElement('canvas'); cv.width = cv.height = size; globeBuf = { size, cv, g: cv.getContext('2d') }; globeBuf.img = globeBuf.g.createImageData(size, size); }
  const d = globeBuf.img.data; d.fill(0);
  const [X, Y, N] = F, T = tex.d, tw = tex.w, th = tex.h;
  const p0 = pos(n), L = Math.hypot(p0[0], p0[1], p0[2]) || 1, s = [-p0[0] / L, -p0[1] / L, -p0[2] / L], lit = n.kind !== 'sun';
  const r0 = R[0], r1 = R[1], r2 = R[2], r3 = R[3], r4 = R[4], r5 = R[5], r6 = R[6], r7 = R[7], r8 = R[8];
  const Nc = hasRing ? [r0 * N[0] + r1 * N[1] + r2 * N[2], r3 * N[0] + r4 * N[1] + r5 * N[2], r6 * N[0] + r7 * N[1] + r8 * N[2]] : null;
  const ringLight = hasRing ? 0.25 + 0.75 * Math.abs(s[0] * N[0] + s[1] * N[1] + s[2] * N[2]) : 0;
  for (let py = 0; py < size; py++) {
    const y = -(py + 0.5 - half) / rr;
    for (let px = 0; px < size; px++) {
      const x = (px + 0.5 - half) / rr, q = x * x + y * y, i = (py * size + px) * 4;
      let onPlanet = q < 1.0, z = onPlanet ? Math.sqrt(1 - q) : 0;
      if (onPlanet) {
        const ex = r0 * x + r3 * y + r6 * z, ey = r1 * x + r4 * y + r7 * z, ez = r2 * x + r5 * y + r8 * z;   // camera -> ecliptic
        const lon = Math.atan2(ex * Y[0] + ey * Y[1] + ez * Y[2], ex * X[0] + ey * X[1] + ez * X[2]);
        const lat = Math.asin(Math.max(-1, Math.min(1, ex * N[0] + ey * N[1] + ez * N[2])));
        const u = ((Math.floor((lon / (2 * Math.PI) + 0.5) * tw) % tw) + tw) % tw, v = Math.min(th - 1, Math.max(0, Math.floor((0.5 - lat / Math.PI) * th)));
        const k = (v * tw + u) * 4;
        let l = lit ? 1 : 1.32;                       // the Sun: boosted, clamped by the byte store
        if (lit) { const c = ex * s[0] + ey * s[1] + ez * s[2]; l = 0.05 + 0.95 * Math.max(0, Math.min(1, (c + 0.04) / 0.16)) * Math.max(0.35, c); }
        const edge = Math.min(1, (1 - Math.sqrt(q)) * rr * 1.5);
        d[i] = T[k] * l; d[i + 1] = T[k + 1] * l; d[i + 2] = T[k + 2] * l; d[i + 3] = 255 * edge;
      }
      if (hasRing && Math.abs(Nc[2]) > 0.02) {       // ring plane: (x, y, zr) . Nc = 0
        const zr = -(x * Nc[0] + y * Nc[1]) / Nc[2], rho = Math.sqrt(q + zr * zr);
        if (rho >= 1.2 && rho <= 2.3 && !(onPlanet && zr < 0)) {
          const rk = Math.min(ring.w - 1, Math.floor((rho - 1.2) / 1.1 * ring.w)) * 4, a = ring.d[rk + 3] / 255;
          if (a > 0.02) {
            // planet shadow on the rings: behind the planet along the Sun direction and inside its cylinder
            const ex = r0 * x + r3 * y + r6 * zr, ey = r1 * x + r4 * y + r7 * zr, ez = r2 * x + r5 * y + r8 * zr;
            const along = ex * s[0] + ey * s[1] + ez * s[2];
            const perp = Math.hypot(ex - along * s[0], ey - along * s[1], ez - along * s[2]);
            const shade = (along < 0 && perp < 1) ? 0.12 : ringLight;
            const cr = ring.d[rk] * shade, cg = ring.d[rk + 1] * shade, cb = ring.d[rk + 2] * shade;
            const a0 = d[i + 3] / 255;                // composite over whatever is there (planet or nothing)
            d[i] = cr * a + d[i] * (1 - a); d[i + 1] = cg * a + d[i + 1] * (1 - a); d[i + 2] = cb * a + d[i + 2] * (1 - a);
            d[i + 3] = 255 * (a + a0 * (1 - a));
          }
        }
      }
    }
  }
  globeBuf.g.putImageData(globeBuf.img, 0, 0);
  const k = r / rr;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(globeBuf.cv, sx - half * k, sy - half * k, size * k, size * k);
  if (n.id === 'earth') { ctx.globalAlpha = 0.25; ctx.strokeStyle = '#7fb4ff'; ctx.lineWidth = Math.max(1, r * 0.02); ctx.beginPath(); ctx.arc(sx, sy, r * 1.01, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  return true;
}
function drawPhase(n, sx, sy, r) {
  // Sunlit side of a planet or moon. The terminator is a great circle perpendicular to the Sun
  // direction; projected, it is an ellipse of half-width r*|sz|, where sz is how much the Sun
  // direction points toward the viewer. Gibbous when sz > 0, crescent when sz < 0.
  const p = pos(n), dx = -p[0], dy = -p[1], dz = -p[2], L = Math.hypot(dx, dy, dz) || 1;

function pick(mx, my) {

  for (const [sx, sy, n, r] of screenPos) {
    const d = Math.hypot(sx - mx, sy - my) - Math.min(r, 8);
    if (d < bd) { bd = d; best = n; }
  }
  if (sat && sat.pos) for (let i = 0; i < sat.n; i++) {
    if (!sat.vis[i]) continue;
    const d = Math.hypot(sat.sx[i] - mx, sat.sy[i] - my) - 2;
    if (d < bd) { bd = d; best = satNode(i); }
  }
  for (const c of [stars, gals, ...activeTiles]) {
    if (!c) continue;
    for (let i = 0; i < c.n; i++) {
      if (!c.vis[i]) continue;
      const d = Math.hypot(c.sx[i] - mx, c.sy[i] - my) - Math.min(c.r[i], 8);
      if (d < bd) { bd = d; best = cloudNode(c, i); }
    }
  }
  return best;
}
function setCenter(id) { centerId = id; $('center').value = id; draw(); }

  mercury: { blurb: 'Smallest planet, closest to the Sun, with a cratered airless surface.', mass: '0.055 Earths', day: '59 days', year: '88 days', temp: '-173 to 427 °C', moons: '0' },
  venus:   { blurb: 'Earth\'s twin in size but wrapped in a crushing CO₂ atmosphere; the hottest planet.', mass: '0.82 Earths', day: '243 days (spins backwards)', year: '225 days', temp: '464 °C', moons: '0' },
  earth:   { blurb: 'Home. The only known world with liquid-water oceans and life.', mass: '1 Earth', day: '24 hours', year: '365.25 days', temp: '15 °C average', moons: '1' },
  moon:    { blurb: 'Earth\'s only natural satellite; the only other world humans have walked on.', mass: '0.012 Earths', day: '27.3 days (tidally locked)', year: '27.3 days around Earth', temp: '-173 to 127 °C', moons: '—' },
  mars:    { blurb: 'The red planet: cold desert with polar caps, the tallest volcano and deepest canyon known.', mass: '0.11 Earths', day: '24.6 hours', year: '687 days', temp: '-63 °C average', moons: '2' },
  jupiter: { blurb: 'Largest planet, a gas giant with a storm (the Great Red Spot) bigger than Earth.', mass: '318 Earths', day: '9.9 hours', year: '11.9 years', temp: '-110 °C cloud tops', moons: '95' },
  saturn:  { blurb: 'Gas giant famous for its bright ring system of ice and rock.', mass: '95 Earths', day: '10.7 hours', year: '29.4 years', temp: '-140 °C cloud tops', moons: '146' },
  uranus:  { blurb: 'Ice giant that spins on its side, tilted 98°.', mass: '14.5 Earths', day: '17.2 hours', year: '84 years', temp: '-195 °C', moons: '28' },
  neptune: { blurb: 'Outermost planet, deep blue with the fastest winds in the solar system.', mass: '17 Earths', day: '16.1 hours', year: '165 years', temp: '-200 °C', moons: '16' },
  pluto:   { blurb: 'Dwarf planet in the Kuiper Belt with a heart-shaped nitrogen-ice plain.', mass: '0.0022 Earths', day: '6.4 days', year: '248 years', temp: '-229 °C', moons: '5' },
};
const SPECTRAL = { O: ['blue', '> 30,000 K'], B: ['blue-white', '10,000–30,000 K'], A: ['white', '7,500–10,000 K'],
  F: ['yellow-white', '6,000–7,500 K'], G: ['yellow', '5,200–6,000 K'], K: ['orange', '3,700–5,200 K'], M: ['red', '< 3,700 K'] };
const LUMCLASS = [['Ia', 'luminous supergiant'], ['Ib', 'supergiant'], ['III', 'giant'], ['II', 'bright giant'], ['IV', 'subgiant'], ['V', 'main-sequence (dwarf)']];
function skyCoords(n) {                 // ecliptic xyz -> RA/Dec (J2000)
  const e = 23.4392911 * Math.PI / 180;
  const xq = n.x, yq = n.y * Math.cos(e) - n.z * Math.sin(e), zq = n.y * Math.sin(e) + n.z * Math.cos(e);
  const r = Math.hypot(xq, yq, zq); if (!r) return null;
  let ra = Math.atan2(yq, xq) * 12 / Math.PI; if (ra < 0) ra += 24;
  const dec = Math.asin(zq / r) * 180 / Math.PI;
  const raMin = Math.round(ra * 60) % (24 * 60), rh = Math.floor(raMin / 60), rm = raMin % 60;
  const decMin = Math.round(Math.abs(dec) * 60), dd = Math.floor(decMin / 60), dm = decMin % 60;
  return `${rh}h ${String(rm).padStart(2, '0')}m, ${dec < 0 ? '-' : '+'}${Math.abs(dd)}° ${String(dm).padStart(2, '0')}'`;
}
function fmtYears(y) {
  if (y < 1) return Math.round(y * 365.25 * 24 * 60) + ' minutes';
  if (y < 1000) return trimNum(y.toPrecision(3)) + ' years';
  if (y < 1e6) return trimNum((y / 1000).toPrecision(3)) + ' thousand years';
  if (y < 1e9) return trimNum((y / 1e6).toPrecision(3)) + ' million years';
  return trimNum((y / 1e9).toPrecision(3)) + ' billion years';
}
function select(n) {
  selected = n; $('info').style.display = 'block'; $('iName').textContent = n.name;
  if (n.kind === 'satellite') satRefresh(n, Date.now());
  const c = byId[centerId] || { x: 0, y: 0, z: 0, name: 'center' };
  const dCenter = Math.hypot(n.x - c.x, n.y - c.y, n.z - c.z), dSun = Math.hypot(n.x, n.y, n.z);
  const kindName = { blackhole: 'black hole', gcluster: 'galaxy cluster', dwarf: 'dwarf planet', sun: 'star', cepheid: 'Cepheid variable star', satellite: 'satellite' }[n.kind] || n.kind;
  const catalog = n.kind === 'galaxy' && n.note == null;
  const rows = [], sect = t => rows.push([null, t]);
  const f = FACTS[n.id];
  $('iSub').textContent = kindName + (n.con ? ` in ${n.con}` : '') + (n.source ? ` · ${n.source.split(';')[0].split(' (')[0]}` : '');
  $('iNote').textContent = n.note || (f ? f.blurb : '');

  if (n.kind === 'satellite') {
    satRefresh(n, Date.now());
    if (sat && sat.worker) sat.worker.postMessage({ track: n.satIndex, t: Date.now(), periodMs: n.period_min * 60000, steps: 120 });
    sect('Orbit');
    rows.push(['Altitude', Math.round(n.alt_km).toLocaleString() + ' km'], ['Speed', n.speed_kms.toFixed(2) + ' km/s'],
              ['Period', n.period_min < 120 ? n.period_min.toFixed(1) + ' min' : (n.period_min / 60).toFixed(2) + ' h'],
              ['Inclination', n.incl.toFixed(1) + '°'], ['Group', n.group], ['NORAD ID', n.norad]);
  }
  sect('Distance');
  if (n.id !== centerId) rows.push([`From ${c.name}`, fmtDist(dCenter)]);
  if (n.kind !== 'sun' && centerId !== 'sun') rows.push(['From the Sun', fmtDist(dSun)]);
  if (dSun > 0.5 && n.kind !== 'sun') rows.push(['Light travel time', fmtYears(dSun / AU_PER_LY)]);
  else if (n.kind !== 'sun') rows.push(['Light travel time', Math.round(dSun * 499 / 60) + ' minutes from the Sun']);
  if (n.dist_pc) rows.push(['In parsecs', n.dist_pc >= 1e6 ? (n.dist_pc / 1e6).toPrecision(3) + ' Mpc' : n.dist_pc >= 1e3 ? (n.dist_pc / 1e3).toPrecision(3) + ' kpc' : n.dist_pc.toPrecision(3) + ' pc']);

  if (f) {
    sect('Facts');
    rows.push(['Mass', f.mass], ['Day length', f.day], ['Year length', f.year], ['Temperature', f.temp]);
    if (f.age) rows.push(['Age', f.age]);
    if (f.moons !== '—') rows.push([n.kind === 'sun' ? 'Planets' : 'Moons', f.moons]);
    if (n.radius_km) rows.push(['Radius', n.radius_km.toLocaleString() + ' km']);
  }
  if (SOLAR.has(n.kind) && n.kind !== 'sun') {
    const incl = Math.atan2(Math.abs(n.z), Math.hypot(n.x, n.y)) * 180 / Math.PI;
    rows.push(['Above ecliptic', `${n.z >= 0 ? '+' : '-'}${fmtDist(Math.abs(n.z))} (${incl.toFixed(1)}°)`]);
  }
  if (n.kind === 'star') {
    sect('Star');
    rows.push(['Apparent brightness', `mag ${n.mag.toFixed(2)}${n.mag <= 6.5 ? ' (naked-eye)' : ''}`]);
    if (n.dist_pc) {
      const M = n.mag - 5 * Math.log10(n.dist_pc / 10), L = 10 ** ((4.83 - M) / 2.5);
      rows.push(['Absolute magnitude', M.toFixed(2)]);
      rows.push(['Luminosity', (L >= 100 ? Math.round(L).toLocaleString() : L.toPrecision(3)) + ' × Sun']);
    }
    const rad = starRadiusAU(n);
    if (rad) rows.push(['Radius (estimated)', (rad / 0.00465 >= 10 ? Math.round(rad / 0.00465) : (rad / 0.00465).toFixed(2)) + ' × Sun' + (rad > 0.05 ? `, ${rad.toFixed(2)} AU` : '')]);
    if (n.spect) {
      const cls = SPECTRAL[n.spect[0].toUpperCase()], lum = LUMCLASS.find(([k]) => n.spect.includes(k));
      rows.push(['Spectral type', n.spect]);
      if (cls) rows.push(['Colour / temperature', `${cls[0]}, ${cls[1]}`]);
      if (lum) rows.push(['Class', lum[1]]);
    }
  }
  if (n.kind === 'galaxy' || n.kind === 'gcluster') {
    sect(n.kind === 'galaxy' ? 'Galaxy' : 'Cluster');
    if (n.dist_pc) {

      rows.push(['Redshift (z)', z < 0.001 ? z.toExponential(2) : z.toFixed(4)]);
      rows.push(['Receding at', Math.round(z * 299792.458).toLocaleString() + ' km/s']);
    }
    if (catalog && n.mag != null) rows.push([n.source.includes('2MASS') ? 'Brightness (K-band)' : 'Brightness (B-band)', (n.source.includes('2MASS') ? n.mag - 3.5 : n.mag).toFixed(2)]);
    if (catalog) rows.push(['Catalog ID', n.id.replace(/^(2mrs|lv)-/, '')]);
  }
  if (n.kind === 'blackhole' && n.note) {
    sect('Black hole');

  const q = encodeURIComponent(n.name.replace(/\s*\(.*\)$/, ''));

    ? `<a target="_blank" rel="noopener" href="https://www.n2yo.com/satellite/?s=${n.norad}">Track on N2YO ↗</a>` +
      `<a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Special:Search?search=${q}">Wikipedia ↗</a>`
    : catalog
    ? `<a target="_blank" rel="noopener" href="https://simbad.cds.unistra.fr/simbad/sim-id?Ident=${encodeURIComponent(n.name)}">SIMBAD ↗</a>` +
      `<a target="_blank" rel="noopener" href="https://ned.ipac.caltech.edu/byname?objname=${encodeURIComponent(n.name)}">NED ↗</a>`
    : `<a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Special:Search?search=${q}">Wikipedia ↗</a>` +
      (n.kind === 'star' || DEEP.has(n.kind) ? `<a target="_blank" rel="noopener" href="https://simbad.cds.unistra.fr/simbad/sim-id?Ident=${q}">SIMBAD ↗</a>` : '');
  draw();
}
function deselect() { selected = null; satTrack = null; $('info').style.display = 'none'; draw(); }
$('iClose').onclick = deselect;

['orbits', 'rings', 'starLabels', 'drops', 'exag', 'galaxy', 'gaia', 'density', 'model', 'cepheids', 'sats', 'starlink'].forEach(id => $(id).onchange = draw);

// ------------------------------------------------------------- data
async function load() {
  let d;
  if (window.STATIC) {                              // static site: prebuilt catalog + daily planets file
    const [cat, pl] = await Promise.all([fetch('data.json').then(r => r.json()), fetch('planets.json').then(r => r.json())]);
    for (const n of cat.nodes) { n.source = cat.sources[n.s]; delete n.s; }
    if (cat.stars) {                                // compact column format: {cols, rows, source}
      const cols = cat.stars.cols;
      for (const row of cat.stars.rows) {
        const n = { kind: 'star', source: cat.stars.source };
        cols.forEach((c, i) => { if (row[i] != null && row[i] !== '') n[c] = row[i]; });
        cat.nodes.push(n);
      }
    }
    d = { nodes: pl.nodes.concat(cat.nodes), edges: pl.edges.concat(cat.edges), meta: { ...cat.meta, epoch: pl.epoch },
          status: { status: `Planets from JPL Horizons, refreshed daily (last ${pl.fetched.slice(0, 16).replace('T', ' ')} UTC).`, busy: false } };
    for (const id of ['epoch', 'refresh', 'reloadStars']) { const el = $(id); el.hidden = true; if (el.previousElementSibling?.tagName === 'LABEL') el.previousElementSibling.hidden = true; }
  } else {
    d = await (await fetch('/api/bodies')).json();
  }
  nodes = d.nodes; edges = d.edges; meta = d.meta; byId = {};
  for (const n of nodes) byId[n.id] = n;
  const opt = n => `<option value="${n.id}">${n.name}</option>`;
  const solar = nodes.filter(n => SOLAR.has(n.kind));
  const deep = nodes.filter(isLandmark).sort((a, b) => a.dist_pc - b.dist_pc);
  const stars = nodes.filter(n => n.kind === 'star' && n.mag <= 2.5).sort((a, b) => a.name.localeCompare(b.name));
  $('center').innerHTML = `<optgroup label="Solar system">${solar.map(opt).join('')}</optgroup>` +
    `<optgroup label="Black holes, clusters, galaxies">${deep.map(opt).join('')}</optgroup>` +
    `<optgroup label="Bright stars">${stars.map(opt).join('')}</optgroup>`;
  $('center').value = byId[centerId] ? centerId : 'sun';
  $('names').innerHTML = nodes.filter(n => !(n.kind === 'galaxy' && n.note == null) || (n.mag ?? 99) <= 10)
    .map(n => `<option value="${n.name}">`).join('');
  if (selected) selected = byId[selected.id] || null;
  buildClouds();
  if (!$('epoch').value && meta.epoch) $('epoch').value = meta.epoch.replace(' ', 'T');
  showStatus(d.status); draw();
  return d.status;
}
function showStatus(s) {
  const el = $('status'); el.textContent = s.status; el.classList.toggle('err', /^Error/.test(s.status));
  $('refresh').disabled = $('reloadStars').disabled = s.busy;
}
async function pollUntilIdle() {
  for (let i = 0; i < 600; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const s = await (await fetch('/api/status')).json();
    showStatus(s.status);
    if (!s.status.busy) { await load(); return; }
  }
}
async function refresh(what) {
  const epoch = $('epoch').value.replace('T', ' ');
  const r = await fetch(`/api/refresh?what=${what}&epoch=${encodeURIComponent(epoch)}`, { method: 'POST' });
  const d = await r.json();
  if (!d.ok) { $('status').textContent = d.error || 'Server is busy, try again shortly.'; return; }
  showStatus(d.status); pollUntilIdle();
}
$('refresh').onclick = () => refresh('planets');
$('reloadStars').onclick = () => refresh('stars');
